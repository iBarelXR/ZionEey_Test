<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Quest 3 Passthrough Markers</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    
    <script>
      AFRAME.registerComponent('billboard', {
        tick: function () {
          var camera = this.el.sceneEl.camera;
          if (!camera) return;
          this.el.object3D.lookAt(camera.position);
        }
      });
    </script>
  </head>
  <body>
    <a-scene 
      webxr="requiredFeatures: local-floor, hit-test; optionalFeatures: dom-overlay; overlayElement: #overlay" 
      renderer="alpha: true; antialias: true; colorManagement: true;"
      background="color: transparent"
    >

      <a-entity id="leftHand" oculus-touch-controls="hand: left">
        
        <a-octahedron 
          color="red" 
          radius="0.03" 
          position="0 0.08 0"
          material="opacity: 0.8; metalness: 0.5; roughness: 0.2"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
        </a-octahedron>
        
        <a-text 
          value="Enemy soldier" 
          color="#FF0000" 
          align="center" 
          position="0 0.20 0" 
          scale="0.3 0.3 0.3"
          billboard>
        </a-text>
      </a-entity>

      <a-entity id="rightHand" oculus-touch-controls="hand: right">
         <a-octahedron 
          color="red" 
          radius="0.03" 
          position="0 0.08 0"
          material="opacity: 0.8; metalness: 0.5; roughness: 0.2"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
        </a-octahedron>
        
        <a-text 
          value="Enemy soldier" 
          color="#FF0000" 
          align="center" 
          position="0 0.20 0" 
          scale="0.3 0.3 0.3"
          billboard>
        </a-text>
      </a-entity>

      <a-entity light="type: ambient; intensity: 0.5;"></a-entity>
      <a-entity light="type: directional; intensity: 0.8;" position="-1 1 0"></a-entity>

    </a-scene>
  </body>
</html>
